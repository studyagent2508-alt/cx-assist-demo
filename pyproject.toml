[project]
name = "cx-assist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.93",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "langchain>=1.4.0",
    "langchain-aws>=1.7.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langsmith>=0.12.4",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests",
    "scikit-learn>=1.9.1",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
cx-assist = "cx_assist:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
